name: Deploy UltimatePOS (homeneeds.genxpos360.com via SFTP)

on:
  push:
    branches: [ home2 ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Validate secrets & connectivity (preflight) ---
      - name: Validate SSH private key format
        run: |
          set -e
          printf '%s' "${{ secrets.ULTIMPOS_SSH_KEY }}" | tr -d '\r' > /tmp/ultimpos_key
          chmod 600 /tmp/ultimpos_key
          echo "Fingerprint (ED25519 expected):"
          ssh-keygen -lf /tmp/ultimpos_key

      - name: SSH preflight (connect & exit)
        run: |
          # Note: ULTIMPOS_SSH_HOST is your server SSH/SFTP host (often an IP/hosting hostname),
          # not the website URL (homeneeds.genxpos360.com).
          ssh -i /tmp/ultimpos_key \
              -p "${{ secrets.ULTIMPOS_SSH_PORT }}" \
              -o StrictHostKeyChecking=no \
              -o IdentitiesOnly=yes \
              "${{ secrets.ULTIMPOS_SSH_USER }}@${{ secrets.ULTIMPOS_SSH_HOST }}" \
              "echo SSH OK: \$(whoami) on \$(hostname)"

      # --- Build assets (NPM) ---
      - name: Install Node.js
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Assets
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          npm ci
          npm run build

      # --- Build deploy artifacts (no vendor) ---
      - name: Prepare deploy artifacts
        shell: bash
        run: |
          set -e
          rm -rf deploy_app deploy_public
          mkdir -p deploy_app deploy_public

          # Core app (NO vendor, NO public)
          cp -r app bootstrap config database routes artisan composer.json composer.lock phpunit.xml .htaccess Modules deploy_app/ 2>/dev/null || true

          # Translations
          if [ -d lang ]; then cp -r lang deploy_app/; fi
          mkdir -p deploy_app/resources
          [ -d resources/lang ]  && cp -r resources/lang  deploy_app/resources/
          [ -d resources/views ] && cp -r resources/views deploy_app/resources/

          # Laravel runtime skeleton
          mkdir -p deploy_app/storage/app
          mkdir -p deploy_app/storage/framework/{cache,sessions,views}
          mkdir -p deploy_app/storage/logs
          mkdir -p deploy_app/bootstrap/cache
          touch deploy_app/storage/.gitignore

          # Public contents
          rsync -a public/ deploy_public/

          # Ensure public/build is deployed and also available under deploy_app/public/build
          mkdir -p deploy_app/public/build
          if [ -d public/build ]; then rsync -a public/build/ deploy_public/build/; fi
          if [ -d public/build ]; then rsync -a public/build/ deploy_app/public/build/; fi

          # ✅ Ensure .htaccess is included explicitly
          if [ -f public/.htaccess ]; then cp public/.htaccess deploy_public/.htaccess; fi

          # Write split-docroot index.php that points to /backend
          cat > deploy_public/index.php <<'PHP'
          <?php

          use Illuminate\Contracts\Http\Kernel;
          use Illuminate\Http\Request;

          define('LARAVEL_START', microtime(true));

          // maintenance file relative to public docroot
            if (file_exists($maintenance = __DIR__ . '/backend/storage/framework/maintenance.php')) {
              require $maintenance;
          }

            // Point to the 'backend' directory (relative to public_html/)
            define('LARAVEL_BASE', __DIR__ . '/backend');

          require LARAVEL_BASE . '/vendor/autoload.php';
          $app = require LARAVEL_BASE . '/bootstrap/app.php';

          /** @var Kernel $kernel */
          $kernel = $app->make(Kernel::class);

          $response = tap($kernel->handle(
              $request = Request::capture()
          ))->send();

          $kernel->terminate($request, $response);
          PHP

      # --- Create remote directories first ---
      - name: Create remote directory structure
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ULTIMPOS_SSH_HOST }}
          port: ${{ secrets.ULTIMPOS_SSH_PORT }}
          username: ${{ secrets.ULTIMPOS_SSH_USER }}
          key: ${{ secrets.ULTIMPOS_SSH_KEY }}
          script: |
            set -e
            # Create directory structure for homeneeds subdomain
            mkdir -p ~/domains/genxpos360.com/public_html/homeneeds/backend
            mkdir -p ~/domains/genxpos360.com/public_html/homeneeds/backend/storage/framework/{cache,sessions,views}
            mkdir -p ~/domains/genxpos360.com/public_html/homeneeds/backend/bootstrap/cache
            echo "✅ Directory structure created"

      # --- SFTP uploads ---
      - name: Upload app via SFTP (to /backend)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.ULTIMPOS_SSH_HOST }}
          port: ${{ secrets.ULTIMPOS_SSH_PORT }}
          username: ${{ secrets.ULTIMPOS_SSH_USER }}
          ssh_private_key: ${{ secrets.ULTIMPOS_SSH_KEY }}
          local_path: "deploy_app/*"
          # Website: https://homeneeds.genxpos360.com
          remote_path: "domains/genxpos360.com/public_html/homeneeds/backend/"
          delete_remote_files: false
          sftp_only: true

      - name: Upload public via SFTP (to /)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.ULTIMPOS_SSH_HOST }}
          port: ${{ secrets.ULTIMPOS_SSH_PORT }}
          username: ${{ secrets.ULTIMPOS_SSH_USER }}
          ssh_private_key: ${{ secrets.ULTIMPOS_SSH_KEY }}
          local_path: "deploy_public/*"
          # Website: https://homeneeds.genxpos360.com
          remote_path: "domains/genxpos360.com/public_html/homeneeds/"
          delete_remote_files: false
          sftp_only: true

      # --- SSH: composer install & caches on the server ---
      - name: SSH - composer install & caches
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ULTIMPOS_SSH_HOST }}
          port: ${{ secrets.ULTIMPOS_SSH_PORT }}
          username: ${{ secrets.ULTIMPOS_SSH_USER }}
          key: ${{ secrets.ULTIMPOS_SSH_KEY }}
          script: |
            set -e
            # Target homeneeds.genxpos360.com Laravel app dir
            cd ~/domains/genxpos360.com/public_html/homeneeds/backend

            # Safety: do not run artisan/migrations until the subdomain has its own .env
            if [ ! -f .env ]; then
              echo "❌ Missing .env at $(pwd)/.env"
              echo "Create it with separate DB credentials and correct APP_URL=https://homeneeds.genxpos360.com"
              exit 1
            fi

            # Ensure runtime dirs
            mkdir -p storage/framework/{cache,sessions,views}
            mkdir -p bootstrap/cache
            chmod -R 755 storage bootstrap/cache || true

            # Check PHP extensions
            REQUIRED="mbstring intl bcmath curl dom fileinfo gd json openssl pdo pdo_mysql tokenizer xml sodium"
            MISSING=""
            for ext in $REQUIRED; do php -m | grep -qi "^$ext$" || MISSING="$MISSING $ext"; done
            if [ -n "$MISSING" ]; then
              echo "❌ Missing PHP extensions:$MISSING"
              exit 1
            fi

            # Install composer if missing
            if ! command -v composer >/dev/null 2>&1; then
              php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
              php composer-setup.php --install-dir=$HOME/bin --filename=composer
              rm composer-setup.php
              export PATH="$HOME/bin:$PATH"
            fi

            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

            # Clear & rebuild caches
            php artisan optimize:clear || true

            # Publish module assets and migrations
            php artisan module:publish || true
            # Note: Inventory module may not exist in all installations
            php artisan module:publish-migration Inventory || echo "⚠️ Inventory module not found, skipping..."

            # Run migrations
            php artisan migrate --force

            # Seed the database (includes currencies)
            # ⚠️ COMMENTED OUT: Only run on first-time setup, not on every deployment
            # Uncomment ONLY if this is a fresh/empty database
            # php artisan db:seed --force

            # Storage link
            php artisan storage:link || true

            # Symlink for user-uploads within homeneeds docroot
            cd ~/domains/genxpos360.com/public_html/homeneeds
            rm -rf user-uploads 2>/dev/null || true
            ln -sf ./backend/public/user-uploads user-uploads
            ls -la user-uploads