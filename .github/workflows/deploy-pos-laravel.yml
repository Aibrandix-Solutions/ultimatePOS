name: Deploy UltimatePOS (demo.genxpos360.com via SSH/rsync)

on:
  push:
    branches: [ demo ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      SSH_HOST: ${{ secrets.ULTIMPOS_SSH_HOST }}
      SSH_PORT: ${{ secrets.ULTIMPOS_SSH_PORT }}
      SSH_USER: ${{ secrets.ULTIMPOS_SSH_USER }}
      REMOTE_BASE: domains/genxpos360.com/public_html/demo
      REMOTE_BACKEND: domains/genxpos360.com/public_html/demo/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Prepare SSH key + known_hosts (no third-party action) ---
      - name: Configure SSH
        run: |
          set -e
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "${{ secrets.ULTIMPOS_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          echo "Fingerprint (expected ED25519):"
          ssh-keygen -lf ~/.ssh/id_deploy

          # Populate known_hosts so StrictHostKeyChecking=yes can pass.
          # Retry a couple of times in case the host is briefly unreachable.
          for i in 1 2 3; do
            if ssh-keyscan -p "$SSH_PORT" -T 10 -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
              break
            fi
            echo "ssh-keyscan attempt $i failed, retrying..."
            sleep 3
          done
          chmod 644 ~/.ssh/known_hosts

          # Reusable SSH options for every step below.
          {
            echo "SSH_OPTS=-i $HOME/.ssh/id_deploy -p $SSH_PORT -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o ServerAliveInterval=30 -o ServerAliveCountMax=4"
          } >> "$GITHUB_ENV"

      - name: SSH preflight (connect & exit)
        run: |
          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "echo SSH OK: \$(whoami) on \$(hostname)"

      # --- Build assets (NPM) ---
      - name: Install Node.js
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Assets
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          npm ci
          npm run build

      # --- Build deploy artifacts (no vendor) ---
      - name: Prepare deploy artifacts
        shell: bash
        run: |
          set -e
          rm -rf deploy_app deploy_public
          mkdir -p deploy_app deploy_public

          # Core app (NO vendor, NO public)
          cp -r app bootstrap config database routes artisan composer.json composer.lock phpunit.xml .htaccess Modules deploy_app/ 2>/dev/null || true

          # Translations
          if [ -d lang ]; then cp -r lang deploy_app/; fi
          mkdir -p deploy_app/resources
          [ -d resources/lang ]  && cp -r resources/lang  deploy_app/resources/
          [ -d resources/views ] && cp -r resources/views deploy_app/resources/

          # Laravel runtime skeleton
          mkdir -p deploy_app/storage/app
          mkdir -p deploy_app/storage/framework/{cache,sessions,views}
          mkdir -p deploy_app/storage/logs
          mkdir -p deploy_app/bootstrap/cache
          touch deploy_app/storage/.gitignore

          # Public contents
          rsync -a public/ deploy_public/

          # Ensure public/build is deployed and also available under deploy_app/public/build
          mkdir -p deploy_app/public/build
          if [ -d public/build ]; then rsync -a public/build/ deploy_public/build/; fi
          if [ -d public/build ]; then rsync -a public/build/ deploy_app/public/build/; fi

          # Ensure .htaccess is included explicitly
          if [ -f public/.htaccess ]; then cp public/.htaccess deploy_public/.htaccess; fi

          # Write split-docroot index.php that points to /backend
          cat > deploy_public/index.php <<'PHP'
          <?php

          use Illuminate\Contracts\Http\Kernel;
          use Illuminate\Http\Request;

          define('LARAVEL_START', microtime(true));

          // maintenance file relative to public docroot
            if (file_exists($maintenance = __DIR__ . '/backend/storage/framework/maintenance.php')) {
              require $maintenance;
          }

            // Point to the 'backend' directory (relative to public_html/)
            define('LARAVEL_BASE', __DIR__ . '/backend');

          require LARAVEL_BASE . '/vendor/autoload.php';
          $app = require LARAVEL_BASE . '/bootstrap/app.php';

          /** @var Kernel $kernel */
          $kernel = $app->make(Kernel::class);

          $response = tap($kernel->handle(
              $request = Request::capture()
          ))->send();

          $kernel->terminate($request, $response);
          PHP

      # --- Create remote directories first ---
      - name: Create remote directory structure
        run: |
          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" bash <<EOF
          set -e
          mkdir -p ~/$REMOTE_BACKEND
          mkdir -p ~/$REMOTE_BACKEND/storage/framework/cache
          mkdir -p ~/$REMOTE_BACKEND/storage/framework/sessions
          mkdir -p ~/$REMOTE_BACKEND/storage/framework/views
          mkdir -p ~/$REMOTE_BACKEND/bootstrap/cache
          echo "Directory structure created"
          EOF

      # --- rsync uploads (replaces SFTP-Deploy-Action) ---
      - name: Upload app via rsync (to /backend)
        run: |
          rsync -az --human-readable --info=stats1 \
            -e "ssh $SSH_OPTS" \
            deploy_app/ \
            "$SSH_USER@$SSH_HOST:$REMOTE_BACKEND/"

      - name: Upload public via rsync (to /)
        run: |
          rsync -az --human-readable --info=stats1 \
            -e "ssh $SSH_OPTS" \
            deploy_public/ \
            "$SSH_USER@$SSH_HOST:$REMOTE_BASE/"

      # --- SSH: composer install & caches on the server ---
      - name: SSH - composer install & caches
        run: |
          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" bash <<EOF
          set -e
          # Target demo.genxpos360.com Laravel app dir
          cd ~/$REMOTE_BACKEND

          # Safety: do not run artisan/migrations until the subdomain has its own .env
          if [ ! -f .env ]; then
            echo "Missing .env at \$(pwd)/.env"
            echo "Create it with separate DB credentials and correct APP_URL=https://demo.genxpos360.com"
            exit 1
          fi

          # Ensure runtime dirs
          mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views
          mkdir -p bootstrap/cache
          chmod -R 755 storage bootstrap/cache || true

          # Check PHP extensions
          REQUIRED="mbstring intl bcmath curl dom fileinfo gd json openssl pdo pdo_mysql tokenizer xml sodium"
          MISSING=""
          for ext in \$REQUIRED; do php -m | grep -qi "^\$ext\$" || MISSING="\$MISSING \$ext"; done
          if [ -n "\$MISSING" ]; then
            echo "Missing PHP extensions:\$MISSING"
            exit 1
          fi

          # Install composer if missing
          if ! command -v composer >/dev/null 2>&1; then
            php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
            mkdir -p \$HOME/bin
            php composer-setup.php --install-dir=\$HOME/bin --filename=composer
            rm composer-setup.php
            export PATH="\$HOME/bin:\$PATH"
          fi

          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

          # Clear & rebuild caches
          php artisan optimize:clear || true

          # Publish module assets and migrations
          php artisan module:publish || true
          # Note: Inventory module may not exist in all installations
          php artisan module:publish-migration Inventory || echo "Inventory module not found, skipping..."

          # Run migrations
          php artisan migrate --force

          # Seed the database (includes currencies)
          # COMMENTED OUT: Only run on first-time setup, not on every deployment
          # Uncomment ONLY if this is a fresh/empty database
          # php artisan db:seed --force

          # Storage link
          php artisan storage:link || true

          # Symlink for user-uploads within homeneeds docroot
          cd ~/$REMOTE_BASE
          rm -rf user-uploads 2>/dev/null || true
          ln -sf ./backend/public/user-uploads user-uploads
          ls -la user-uploads
          EOF

      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/id_deploy
