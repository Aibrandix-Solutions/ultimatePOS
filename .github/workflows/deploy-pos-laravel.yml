name: Deploy Laravel (pos.himan.fun via SFTP)

on:
  push:
    branches: [ update ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Validate secrets & connectivity (preflight) ---
      - name: Validate SSH private key format
        run: |
          set -e
          echo "${{ secrets.POS_SSH_KEY }}" > /tmp/pos_key
          chmod 600 /tmp/pos_key
          echo "Fingerprint (ED25519 expected):"
          ssh-keygen -lf /tmp/pos_key

      - name: SSH preflight (connect & exit)
        run: |
          ssh -i /tmp/pos_key \
              -p "${{ secrets.POS_SSH_PORT }}" \
              -o StrictHostKeyChecking=no \
              -o IdentitiesOnly=yes \
              "${{ secrets.POS_SSH_USER }}@${{ secrets.POS_SSH_HOST }}" \
              "echo SSH OK: \$(whoami) on \$(hostname)"

      # --- Build deploy artifacts (no vendor, no node build) ---
      - name: Prepare deploy artifacts
        shell: bash
        run: |
          set -e
          rm -rf deploy_app deploy_public
          mkdir -p deploy_app deploy_public

          # Core app (NO vendor, NO public)
          cp -r app bootstrap config database routes artisan composer.json composer.lock phpunit.xml .htaccess deploy_app/ 2>/dev/null || true

          # Translations (support both layouts)
          if [ -d lang ]; then cp -r lang deploy_app/; fi
          mkdir -p deploy_app/resources
          [ -d resources/lang ]  && cp -r resources/lang  deploy_app/resources/
          [ -d resources/views ] && cp -r resources/views deploy_app/resources/

          # Laravel runtime skeleton
          mkdir -p deploy_app/storage/app
          mkdir -p deploy_app/storage/framework/{cache,sessions,views}
          mkdir -p deploy_app/storage/logs
          mkdir -p deploy_app/bootstrap/cache
          touch deploy_app/storage/.gitignore

          # Public contents
          rsync -a public/ deploy_public/
          # ✅ Ensure .htaccess is included explicitly
          if [ -f public/.htaccess ]; then cp public/.htaccess deploy_public/.htaccess; fi

          # Write split-docroot index.php that points to /laravel
          cat > deploy_public/index.php <<'PHP'
          <?php
          use Illuminate\Contracts\Http\Kernel;
          use Illuminate\Http\Request;
          define('LARAVEL_START', microtime(true));

          // maintenance file relative to public docroot
          if (file_exists($maintenance = __DIR__ . '/storage/framework/maintenance.php')) {
              require $maintenance;
          }

          define('LARAVEL_BASE', __DIR__ . '/laravel');
          require LARAVEL_BASE . '/vendor/autoload.php';
          $app = require LARAVEL_BASE . '/bootstrap/app.php';

          /** @var Kernel $kernel */
          $kernel = $app->make(Kernel::class);
          $response = tap($kernel->handle(
              $request = Request::capture()
          ))->send();
          $kernel->terminate($request, $response);
          PHP

      # --- SFTP uploads (port 65002) ---
      - name: Upload app via SFTP (to /pos/laravel)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.POS_SSH_HOST }}
          port: ${{ secrets.POS_SSH_PORT }}
          username: ${{ secrets.POS_SSH_USER }}
          ssh_private_key: ${{ secrets.POS_SSH_KEY }}
          local_path: 'deploy_app/*'
          remote_path: 'domains/himan.fun/public_html/pos/laravel/'
          delete_remote_files: false   # keep .env and vendor on server
          sftp_only_changed: true
          # 🚫 Belt & braces: never upload any .env file even if it appears locally
          exclude: |
            .env
            .env.*
            **/.env
            **/.env.*

      - name: Upload public via SFTP (to /pos/)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.POS_SSH_HOST }}
          port: ${{ secrets.POS_SSH_PORT }}
          username: ${{ secrets.POS_SSH_USER }}
          ssh_private_key: ${{ secrets.POS_SSH_KEY }}
          local_path: 'deploy_public/*'
          remote_path: 'domains/himan.fun/public_html/pos/'
          delete_remote_files: false   # ⚠️ don’t wipe uploads/files
          sftp_only_changed: true
          exclude: |
            uploads/**
            files/**
            storage/**
            .well-known/**

      # --- SSH: composer install & caches on the server ---
      - name: SSH - composer install & caches
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.POS_SSH_HOST }}
          port: ${{ secrets.POS_SSH_PORT }}
          username: ${{ secrets.POS_SSH_USER }}
          key: ${{ secrets.POS_SSH_KEY }}
          script: |
            set -e
            # Use absolute path (no ~ to avoid expansion issues)
            cd /home/u972195898/domains/himan.fun/public_html/pos/laravel

            # Ensure runtime dirs BEFORE composer
            mkdir -p storage/framework/{cache,sessions,views}
            mkdir -p bootstrap/cache
            chmod -R 755 storage bootstrap/cache || true

            # Check common PHP extensions
            REQUIRED="mbstring intl bcmath curl dom fileinfo gd json openssl pdo pdo_mysql tokenizer xml sodium"
            MISSING=""
            for ext in $REQUIRED; do php -m | grep -qi "^$ext$" || MISSING="$MISSING $ext"; done
            if [ -n "$MISSING" ]; then
              echo "❌ Missing PHP extensions:$MISSING"
              echo "Enable in hPanel → Advanced → PHP Configuration → PHP Extensions."
              exit 1
            fi

            # Install composer locally if absent
            if ! command -v composer >/dev/null 2>&1; then
              php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
              php composer-setup.php --install-dir=$HOME/bin --filename=composer
              rm composer-setup.php
              export PATH="$HOME/bin:$PATH"
            fi

            php -v || true
            composer -V || true

            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

            # Clear & rebuild caches
            php artisan config:clear || true
            php artisan route:clear || true
            php artisan view:clear  || true

            php artisan config:cache || true
            php artisan route:cache  || true
            php artisan view:cache   || true

            # Remove old symlink and ensure uploads directory structure
            cd /home/u972195898/domains/himan.fun/public_html/pos
            if [ -L uploads ]; then
              echo "🔧 Removing old uploads symlink"
              rm -f uploads
            fi
            
            # Ensure physical uploads directories exist
            mkdir -p uploads/{img,media,business_logos,invoice_logos,files}
            chmod -R 755 uploads || true
            
            echo "✅ Uploads directory structure verified"
