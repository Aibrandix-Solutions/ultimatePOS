name: Deploy Laravel (pos.himan.fun)

on:
  push:
    branches: [ himan ]         # <- your deploy branch
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # We don't need Composer locally anymore (no vendor upload).
      # Prepare deploy artifacts without /public and without /vendor

      - name: Prepare deploy artifacts
        shell: bash
        run: |
          set -e
          rm -rf deploy_app deploy_public deploy_tmp
          mkdir -p deploy_app deploy_public

          # Stage excluding CI/dev directories
          rsync -a . ./deploy_tmp \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.github' \
            --exclude 'tests' \
            --exclude '.env' \
            --exclude '.env.*'

          # 1) App without /public and without /vendor (vendor will be installed on server)
          rsync -a --delete ./deploy_tmp/ ./deploy_app/ \
            --exclude 'public' \
            --exclude 'vendor'

          # 2) Public (contents of /public)
          rsync -a ./public/ ./deploy_public/

          # Patch public/index.php to load app from /laravel
          php -r '
            $f = "deploy_public/index.php";
            $c = file_get_contents($f);
            $c = preg_replace(
              "/require __DIR__ \\. \"\\/\\.\\.\\/vendor\\/autoload\\.php\";/",
              "define(\\\"LARAVEL_BASE\\\", __DIR__ . \\\"/laravel\\\");\nrequire LARAVEL_BASE . \\\"/vendor/autoload.php\\\";",
              $c
            );
            $c = preg_replace(
              "/require_once __DIR__ \\. \"\\/\\.\\.\\/bootstrap\\/app\\.php\";/",
              "$app = require LARAVEL_BASE . \\\"/bootstrap/app.php\\\";",
              $c
            );
            file_put_contents($f, $c);
          '

      # Upload the Laravel app (no vendor) to /public_html/pos/laravel/
      - name: Upload app (laravel/)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.0
        with:
          server: ${{ secrets.POS_FTP_HOST }}
          username: ${{ secrets.POS_FTP_USER }}
          password: ${{ secrets.POS_FTP_PASS }}
          protocol: ftps
          port: 21
          local-dir: ./deploy_app/
          server-dir: ./laravel/
          # incremental uploads so we don't re-upload everything each time
          state-name: ftp-state-laravel.json
          log-level: verbose
          exclude: |
            **/.git*
            **/node_modules/**
            **/tests/**
            **/storage/logs/**
            **/storage/framework/{cache,sessions,views}/**
            **/.DS_Store
            **/Thumbs.db

      # Upload public (web root) to /public_html/pos/
      - name: Upload public (web root)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.0
        with:
          server: ${{ secrets.POS_FTP_HOST }}
          username: ${{ secrets.POS_FTP_USER }}
          password: ${{ secrets.POS_FTP_PASS }}
          protocol: ftps
          port: 21
          local-dir: ./deploy_public/
          server-dir: ./
          state-name: ftp-state-public.json
          log-level: verbose
          exclude: |
            **/.git*
            **/.DS_Store
            **/Thumbs.db

      # Run Composer on the server via SSH (fast & no huge uploads)
      - name: SSH - install vendor and cache config
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.POS_SSH_HOST }}
          username: ${{ secrets.POS_SSH_USER }}
          key: ${{ secrets.POS_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd ~/domains/himan.fun/public_html/pos/laravel

            # Optional: show PHP and Composer versions (Composer should be available on Hostinger)
            php -v || true
            composer -V || true

            # Install vendor on server (prod, optimized)
            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

            # Ensure writable directories
            chmod -R 755 storage bootstrap/cache || true

            # Cache (optional but recommended)
            php artisan config:cache || true
            php artisan route:cache || true
            php artisan view:cache || true

            # Storage link (first time)
            php artisan storage:link || true
